    accessed: 2026-07-27
    role: >-
      pinned projection-shortcut, dropout-placement, and weight-initialization
      implementation reference. Verbatim at the 2026-07-27 audit:
      `models/utils.lua` MSRinit uses `local n = v.kW*v.kH*v.nInputPlane` with
      `v.weight:normal(0, math.sqrt(2/n))` and `v.bias:zero()`, and FCinit
      zeroes only the fully connected bias; `pytorch/utils.py` calls
      `kaiming_normal_(torch.Tensor(no, ni, k, k))` with no mode argument, whose
      PyTorch default is fan_in. Both implementations therefore agree on fan_in.
      `pytorch/resnet.py` applies the projection shortcut to the pre-activated
      tensor `o1`, not to the raw block input.
