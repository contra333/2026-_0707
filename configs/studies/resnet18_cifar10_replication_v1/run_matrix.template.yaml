pairing:
  within_lr: same_seed_initialization_and_data_stream
  across_lr: same_seed_initialization_and_data_stream
  cross_lr_pairing_block_id: required

output_policy:
  launch_bundle_root: artifacts/
  artifact_namespace: resnet18_cifar10_replication_v1
  commit_generated_bundle: false
  protected_evaluation_allowed: false
  gpu_launch_allowed: false
