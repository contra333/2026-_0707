schema_version: resnet18_cifar10_replication_plan_v1
protocol_id: protocol_fixed_branch_refitted_md_architecture_replication_v1
study_id: resnet18_cifar10_replication_v1
base_training_config: configs/training/cifar10_resnet18_replication_v1.yaml

matrix:
  learning_rates: [0.001, 0.0003]
  weight_decay: 0.0001
  roles: [adam_coupled, adamw_decoupled]
  research_seeds: [0, 1, 2, 3, 4]
