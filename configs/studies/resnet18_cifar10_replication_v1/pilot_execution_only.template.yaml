schema_version: resnet18_cifar10_replication_pilot_template_v1
protocol_id: protocol_fixed_branch_refitted_md_architecture_replication_v1
base_training_config: configs/training/cifar10_resnet18_replication_v1.yaml
seed: 9000
max_epochs: 2
arms:
  learning_rates: [0.001, 0.0003]
  weight_decay: 0.0001
  roles: [adam_coupled, adamw_decoupled]
  count: 4
execution_only: true
aggregate_eligible: false
from_scratch: true
defer_id_test: true
approval:
  pilot_gpu: REQUIRED_SEPARATELY
  main_training_gpu: NOT_AUTHORIZED_BY_PILOT_APPROVAL
  protected_evaluation: NOT_AUTHORIZED
measurements:
  seconds_per_epoch: REQUIRED
  peak_vram_bytes: REQUIRED
  checkpoint_storage_bytes: REQUIRED
