schema_version: "1.0"

dataset:
  protocol: oge_cifar10_holdout_v1
  config_path: configs/datasets/oge_cifar10_holdout_v1.yaml
  train_split: id_train
  validation_split: id_validation
  test_split: id_test

model:
  name: resnet18
  variant: cifar
  num_classes: 10

loss:
  name: cross_entropy
  label_smoothing: 0.0

optimizer:
  name: adamw
  lr: 0.001
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  weight_decay: 0.0001
  weight_decay_policy: weights_only_no_bias_norm

scheduler:
  name: multistep
  milestones: [60, 120, 160]
  gamma: 0.2
  step_timing: end_of_epoch

training:
  max_epochs: 200
  batch_size: 128
  seed: 0
  num_workers: 0
  pin_memory: false
  drop_last: false
  persistent_workers: false
  precision: fp32
  deterministic: true

checkpoint:
  snapshot_epochs: [0, 200]
